<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>MeTalk</title>
  <meta name="description" content="Prosta aplikacja do komunikacji wspomagającej (AAC) dla dzieci.">
  <meta name="theme-color" content="#FF7A2B">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="MeTalk">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body class="logged-out">
  <!-- Ekran logowania: wybór użytkownika (profile na tym urządzeniu, bez haseł) -->
  <section id="login" class="login">
    <img class="login-logo" src="icons/icon.svg" alt="">
    <h1 class="login-title"><span class="me">Me</span><span class="talk">Talk</span></h1>
    <label class="login-label" for="user-select" data-i18n="userLabel">Użytkownik</label>
    <select id="user-select" class="login-select"></select>
    <button id="btn-login" class="login-btn" type="button" data-i18n="login" disabled>Zaloguj</button>
    <button id="btn-delete-user" class="login-delete" type="button" data-i18n="deleteUser" disabled>Usuń użytkownika</button>
    <button id="btn-edit-mode" class="login-updates" type="button" data-i18n="editModeBtn" disabled>✏️ Tryb edycji</button>
    <button id="btn-check-updates" class="login-updates" type="button" data-i18n="updatesBtn">🔄 Sprawdź aktualizacje</button>
  </section>

  <!-- Sprawdź aktualizacje (ekran logowania): tylko sprawdza; aktualizuje dopiero „KLIKNIJ TUTAJ” -->
  <dialog id="updates-dialog" class="settings">
    <div class="settings-inner">
      <h2 data-i18n="updatesTitle">Aktualizacje</h2>
      <section class="update-part">
        <h3 data-i18n="appVersionTitle">Wersja aplikacji</h3>
        <p id="update-app-status" class="update-status"></p>
        <button id="btn-update-app" class="dlg-btn save" type="button" data-i18n="clickHere" hidden>KLIKNIJ TUTAJ</button>
      </section>
      <section class="update-part">
        <h3 data-i18n="dictVersionTitle">Wersja słownika</h3>
        <p id="update-dict-status" class="update-status"></p>
        <button id="btn-update-dict" class="dlg-btn save" type="button" data-i18n="clickHere" hidden>KLIKNIJ TUTAJ</button>
      </section>
      <button id="btn-updates-close" class="dlg-btn cancel" type="button" data-i18n="done">Gotowe</button>
    </div>
  </dialog>

  <!-- Test dla opiekuna (wylogowanie i wejście w tryb edycji): liczba 100–999 zapisana słownie,
       trzeba wpisać ją cyframi (żeby dziecko nie zrobiło tego przypadkiem) -->
  <dialog id="logout-dialog" class="settings">
    <form class="settings-inner" id="logout-form">
      <h2 id="code-title">Wylogowanie</h2>
      <p id="code-instr" class="logout-instr">Aby się wylogować, wpisz cyframi liczbę:</p>
      <div id="logout-code" class="logout-code words">sto</div>
      <input id="logout-input" class="name-input code-input" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="3" autocomplete="off" autocorrect="off" spellcheck="false">
      <p id="logout-error" class="form-error" hidden></p>
      <button id="btn-logout-confirm" class="dlg-btn danger" type="submit">Wyloguj</button>
      <button id="btn-logout-cancel" class="big-back" type="button" data-i18n="undo">Cofnij</button>
    </form>
  </dialog>

  <!-- Okno Tak/Nie (👍/👎) – na razie nieużywane, gotowe do wykorzystania: askYesNo(pytanie, poTak) -->
  <dialog id="confirm-yesno" class="settings">
    <div class="settings-inner">
      <h2 id="yesno-question"></h2>
      <div class="confirm-row">
        <button id="btn-yes" class="confirm-btn yes" type="button"><span class="confirm-emoji">👍</span><span data-i18n="yes">Tak</span></button>
        <button id="btn-no" class="confirm-btn no" type="button"><span class="confirm-emoji">👎</span><span data-i18n="no">Nie</span></button>
      </div>
    </div>
  </dialog>

  <!-- Usuwanie użytkownika: trzeba przepisać imię + 12 (zabezpieczenie przed dzieckiem) -->
  <dialog id="delete-user" class="settings">
    <form class="settings-inner" id="delete-user-form">
      <h2 data-i18n="deleteTitle">Usuń użytkownika</h2>
      <p id="delete-instr" class="delete-instr"></p>
      <input id="delete-confirm" class="name-input" type="text" maxlength="40" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
      <p id="delete-error" class="form-error" hidden></p>
      <button id="btn-delete-confirm" class="dlg-btn danger" type="submit" data-i18n="delete">Usuń</button>
      <button id="btn-delete-cancel" class="dlg-btn cancel" type="button" data-i18n="undo">Cofnij</button>
    </form>
  </dialog>

  <dialog id="add-user" class="settings">
    <form method="dialog" class="settings-inner" id="add-user-form">
      <h2 data-i18n="newUserTitle">Nowy użytkownik</h2>
      <input id="new-user-name" class="name-input" type="text" maxlength="30" autocomplete="off" autocapitalize="words" spellcheck="false" placeholder="Imię">
      <p id="new-user-error" class="form-error" hidden></p>
      <button id="btn-save-user" class="dlg-btn save" type="submit" value="save" data-i18n="save">Zapisz</button>
      <button id="btn-cancel-user" class="dlg-btn cancel" type="button" data-i18n="cancel">Anuluj</button>
    </form>
  </dialog>

  <header class="sticky">
    <nav class="topbar">
      <button id="btn-back" class="barbtn" type="button" aria-label="Wstecz">⬅️</button>
      <button id="btn-home" class="barbtn" type="button" aria-label="Start">🏠</button>
      <button id="btn-logout" class="barbtn logout" type="button" aria-label="Wyloguj"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v8" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" fill="none"/><path d="M7.05 6.4a7.5 7.5 0 1 0 9.9 0" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" fill="none"/></svg></button>
      <h1 id="title">MeTalk</h1>
      <button id="btn-fav" class="barbtn" type="button" aria-label="Ulubione">⭐</button>
    </nav>
    <div id="strip" class="strip">
      <button id="strip-clear" class="strip-btn clear" type="button" aria-label="Usuń">✖️</button>
      <button id="strip-left" class="strip-arrow" type="button" aria-label="Przewiń w lewo">‹</button>
      <div id="strip-items" class="strip-items"></div>
      <button id="strip-right" class="strip-arrow" type="button" aria-label="Przewiń w prawo">›</button>
      <button id="strip-play" class="strip-btn play" type="button" aria-label="Odtwórz">▶️</button>
    </div>
    <!-- Tryb edycji: schowek (wytnij/kopiuj → wklej) i zakończenie edycji -->
    <div id="edit-bar" class="edit-bar" hidden>
      <span id="edit-clip" class="edit-clip"></span>
      <button id="edit-paste" class="edit-bar-btn paste" type="button" hidden></button>
      <button id="edit-clip-clear" class="edit-bar-btn" type="button" hidden>✖</button>
      <button id="edit-done" class="edit-bar-btn done" type="button"></button>
    </div>
  </header>

  <!-- Edycja kafelka / kategorii (tryb edycji) -->
  <dialog id="edit-dialog" class="settings">
    <form class="settings-inner" id="edit-form">
      <h2 id="edit-title"></h2>
      <div id="edit-preview" class="edit-preview"></div>
      <label id="edit-text-label" class="edit-label" for="edit-text"></label>
      <input id="edit-text" class="name-input" type="text" maxlength="40" autocomplete="off" spellcheck="false">
      <input id="edit-emoji" class="name-input emoji-input" type="text" maxlength="8" autocomplete="off" spellcheck="false">
      <p id="edit-error" class="form-error" hidden></p>
      <button id="edit-photo" class="dlg-btn test" type="button"></button>
      <button id="edit-reset" class="dlg-btn cancel" type="button"></button>
      <div class="edit-row">
        <button id="edit-cut" class="dlg-btn cancel" type="button"></button>
        <button id="edit-copy" class="dlg-btn cancel" type="button"></button>
      </div>
      <button id="edit-delete" class="dlg-btn danger" type="button"></button>
      <button id="edit-save" class="dlg-btn save" type="submit"></button>
      <button id="edit-cancel" class="dlg-btn cancel" type="button"></button>
      <input id="edit-file" type="file" accept="image/*" hidden>
    </form>
  </dialog>

  <div id="lang-wrap" class="lang-wrap">
    <label class="lang-label">
      <span data-i18n="language">🌐 Język</span>
      <select id="lang" class="lang-select"></select>
    </label>
    <div id="app-version" class="app-version"></div>
    <!-- Komunikat dla opiekuna, gdy telefon nie ma głosu w wybranym języku -->
    <div id="voice-warning" class="voice-warning" hidden>
      <p id="voice-warning-text"></p>
      <div class="voice-warning-btns">
        <button id="btn-install-voice" type="button" data-i18n="installVoice" hidden>Zainstaluj głos</button>
        <button id="btn-hide-warning" type="button" data-i18n="gotIt">Rozumiem</button>
      </div>
    </div>
  </div>

  <main id="list" class="list" aria-live="polite"></main>

  <div id="settings-wrap" class="settings-wrap" hidden>
    <button id="btn-settings" class="settings-btn" type="button" data-i18n="settingsBtn">⚙️ Ustawienia głosu</button>
  </div>

  <dialog id="settings" class="settings">
    <form method="dialog" class="settings-inner">
      <h2 data-i18n="settingsTitle">Ustawienia głosu</h2>
      <fieldset>
        <legend data-i18n="voice">Głos</legend>
        <div id="voice-list" class="voice-list"></div>
      </fieldset>
      <label class="rate">
        <span><span data-i18n="rate">Tempo</span>: <strong id="rate-value">90%</strong></span>
        <input id="rate" type="range" min="50" max="130" step="5" value="90">
      </label>
      <label class="rate">
        <span><span data-i18n="volume">Głośność</span>: <strong id="volume-value">100%</strong></span>
        <input id="volume" type="range" min="10" max="100" step="5" value="100">
      </label>
      <label class="rate">
        <span><span data-i18n="pitch">Wysokość głosu</span>: <strong id="pitch-value">100%</strong></span>
        <input id="pitch" type="range" min="50" max="150" step="5" value="100">
      </label>
      <button id="btn-test" class="dlg-btn test" type="button" data-i18n="test">🔊 Test</button>
      <p id="speech-diag" class="speech-diag"></p>
      <button class="dlg-btn close" value="close" data-i18n="done">Gotowe</button>
    </form>
  </dialog>

  <script src="version.js"></script>
  <script src="speech.js"></script>
  <script src="app.js"></script>
</body>
</html>
