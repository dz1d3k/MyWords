<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- legs -->
  <rect x="38" y="92" width="9" height="28" rx="4" fill="#222"/>
  <rect x="80" y="92" width="9" height="28" rx="4" fill="#222"/>
  <!-- woolly body -->
  <g fill="#FAFAFA" stroke="#BDBDBD" stroke-width="2">
    <circle cx="40" cy="80" r="18"/><circle cx="64" cy="86" r="20"/><circle cx="88" cy="80" r="18"/>
    <circle cx="52" cy="66" r="18"/><circle cx="78" cy="66" r="18"/>
  </g>
  <!-- black face -->
  <ellipse cx="64" cy="50" rx="22" ry="28" fill="#1E1E1E"/>
  <!-- ears -->
  <ellipse cx="36" cy="40" rx="11" ry="5" fill="#1E1E1E" transform="rotate(-20 36 40)"/>
  <ellipse cx="92" cy="40" rx="11" ry="5" fill="#1E1E1E" transform="rotate(20 92 40)"/>
  <!-- tuft -->
  <g fill="#FAFAFA" stroke="#BDBDBD" stroke-width="2">
    <circle cx="56" cy="22" r="8"/><circle cx="66" cy="18" r="9"/><circle cx="75" cy="23" r="7"/>
  </g>
  <!-- big eyes -->
  <ellipse cx="55" cy="44" rx="9" ry="11" fill="#FFF"/><circle cx="57" cy="46" r="4" fill="#111"/>
  <ellipse cx="73" cy="44" rx="9" ry="11" fill="#FFF"/><circle cx="71" cy="46" r="4" fill="#111"/>
  <path d="M56 66 Q64 71 72 66" stroke="#FFF" stroke-width="2.5" fill="none" stroke-linecap="round"/>
</svg>
